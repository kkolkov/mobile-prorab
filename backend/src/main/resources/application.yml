spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:prorab}
    username: ${DB_USER:prorab}
    password: ${DB_PASSWORD:prorab}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${PORT:${SERVER_PORT:8080}}
